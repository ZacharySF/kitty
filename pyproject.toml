[project]
name = "kitty"
version = "0.1.0"
description = "Personal job-search tracker: discovery, triage, apply queue, outcomes."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "textual>=0.80",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "python-jobspy>=1.1.82",
    "anthropic>=1.11.0",
    "google-auth-oauthlib>=1.5.0",
    "mcp>=2.2.0",
    "websockets>=15",
    "pypdf>=6.19.0",
    "python-dateutil>=2.9",
    "icalendar>=6.3",
    "fsrs>=6.3,<7",
    "zstandard>=0.23",
    "Pillow>=11",
    "PyMuPDF>=1.25",
    "sympy>=1.13",
    "lark>=1.2",
    "antlr4-python3-runtime==4.11.*",
]

[project.scripts]
kitty = "kitty.cli:main"
kitty-web = "kitty.web_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
