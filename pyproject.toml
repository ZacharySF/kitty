[project]
name = "applyai"
version = "0.1.0"
description = "Personal job-search tracker: discovery, triage, apply queue, outcomes."
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "python-jobspy>=1.1.82",
    "anthropic>=1.11.0",
    "google-auth-oauthlib>=1.5.0",
    "mcp>=2.2.0",
    "websockets>=15",
    "pypdf>=6.19.0",
]

[project.scripts]
applyai = "applyai.cli:main"
applyai-web = "applyai.web_server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applyai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
