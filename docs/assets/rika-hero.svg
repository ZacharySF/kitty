<svg xmlns="http://www.w3.org/2000/svg" width="846" height="440" viewBox="0 0 846 440" role="img" aria-labelledby="title desc">
<title id="title">rika! — a home for your beautifully tangled mind.</title>
<desc id="desc">An oversized italic rika! wordmark beside a curious cat, loose sheets of notes and a looping thread. A local-first workspace for connected ideas.</desc>
<style>
@font-face{font-family:RikaDisplay;src:url(data:font/woff2;base64,) format('woff2');font-weight:600;font-style:italic}
:root{--fg:#292331;--muted:#655d70;--border:#e2dce9;--surface:#ffffff;--accent:#b8517d}
@media(prefers-color-scheme:dark){:root{--fg:#f1edf5;--muted:#b4aabd;--border:#302a38;--surface:#0d1117;--accent:#e9a8c2}}
.display{font-family:RikaDisplay,Georgia,serif;font-weight:600;font-style:italic;fill:var(--fg)}
.label{font-family:ui-monospace,monospace;font-size:12px;font-weight:400;fill:var(--muted)}
.hand{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<text x="24" y="36" class="label" letter-spacing="1">YOUR IDEAS HAVE A PLACE HERE</text>
<text x="16" y="220" class="display" font-size="176">rika!</text>
