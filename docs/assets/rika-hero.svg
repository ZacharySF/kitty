  <path d="M628 144 L600 140 M628 152 L600 156 M732 144 L760 140 M732 152 L760 156"/>
  <path d="M520 60 L580 48 L592 112 L532 124 Z" fill="var(--surface)"/>
  <path d="M536 76 L568 68 M540 88 L572 80 M544 100 L564 96"/>
  <path d="M752 200 L800 212 L788 268 L740 256 Z" fill="var(--surface)"/>
  <path d="M764 220 L784 224 M760 232 L780 236 M756 244 L768 248"/>
</g>
<text x="524" y="44" class="label">a thought</text>
<text x="744" y="296" class="label">a next step</text>
<text x="24" y="304" class="display" font-size="36">A home for your</text>
<text x="24" y="348" class="display" font-size="36">beautifully tangled mind.</text>
