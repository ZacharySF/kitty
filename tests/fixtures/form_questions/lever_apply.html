<!DOCTYPE html>
<!-- Trimmed from a real jobs.lever.co/<board>/<id>/apply page (2026-10-03). -->
<html><body>
<div class="page"><input type="text" name="search" placeholder="Search jobs"></div>
<form id="application-form" enctype="multipart/form-data" method="POST"><div class="section page-centered application-form"><h4>Submit your application</h4><ul>
<li class="application-question resume"><label><div class="application-label">Resume/CV <span class="required">✱</span></div><div class="application-field"><input class="application-file-input invisible-resume-upload" type="file" name="resume" required></div></label></li>
<li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" data-qa="name-input" name="name" required></div></label></li>
<li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input name="email" data-qa="email-input" type="email" required></div></label></li>
<li class="application-question" data-qa="structured-contact-location-question"><label><div class="application-label">Current location <span class="required">✱</span></div><div class="application-field"><input class="location-input" type="text" name="location" required><input id="selected-location" type="hidden" name="selectedLocation"></div></label></li>
<li class="application-question"><label><div class="application-label">Current company </div><div class="application-field"><input type="text" data-qa="org-input" name="org"></div></label></li></ul></div>
<div class="section page-centered application-form" data-qa="additional-cards"><h4 data-qa="card-name">Work Authorization</h4><input type="hidden" value="{&quot;text&quot;:&quot;Work Authorization&quot;}" name="cards[1c71][baseTemplate]"><ul>
<li class="application-question custom-question"><div><div class="application-label full-width multiple-choice"><div class="text">Do you currently hold an active US security clearance?<span class="required">✱</span></div></div><div class="application-field full-width required-field"><ul data-qa="multiple-choice"><li><label><input type="radio" name="cards[1c71][field0]" value="Yes" required="required" /><span class="application-answer-alternative">Yes</span></label></li><li><label><input type="radio" name="cards[1c71][field0]" value="No" required="required" /><span class="application-answer-alternative">No</span></label></li></ul></div></div></li>
<li class="application-question custom-question"><div><div class="application-label full-width dropdown"><div class="text">If selected, when would you be able to start?<span class="required">✱</span></div></div><div class="application-field full-width required-field"><div class="application-dropdown"><select name="cards[1c71][field1]" required><option value="">Select...</option><option value="May 2027">May 2027</option><option value="June 2027">June 2027</option></select></div></div></div></li>
<li class="application-question custom-question"><div><div class="application-label full-width multiple-select"><div class="text">Language Skill(s) (Check all that apply)</div></div><div class="application-field full-width"><ul data-qa="checkboxes"><li><label><input type="checkbox" name="cards[1c71][field2]" value="English (ENG)" /><span class="application-answer-alternative">English (ENG)</span></label></li><li><label><input type="checkbox" name="cards[1c71][field2]" value="Spanish (SPA)" /><span class="application-answer-alternative">Spanish (SPA)</span></label></li></ul></div></div></li>
<li class="application-question custom-question"><div><div class="application-label full-width textarea"><div class="text">Describe a hardware project you are proud of.<span class="required">✱</span></div></div><div class="application-field full-width required-field"><textarea class="card-field-input" name="cards[1c71][field3]" required="required"></textarea></div></div></li>
</ul></div>
<div class="section page-centered application-form"><label for="additional-information"><h4>Additional information</h4></label><div class="application-additional"><textarea placeholder="Add a cover letter or anything else you want to share." name="comments" id="additional-information"></textarea></div></div>
<div class="section eeo-section page-centered application-form" data-qa="eeo-section"><h4>Self-identification of veteran status</h4><div class="application-question"><label><div class="application-label">Veteran status</div><div class="application-field"><div class="application-dropdown"><select name="eeo[veteran]"><option value="">Select ...</option><option value="Protected veteran">I identify as one or more of the classifications of protected veteran listed above</option><option value="Not a protected veteran">I am not a protected veteran</option></select></div></div></label></div>
<div class="application-question"><label><div class="application-label">Date</div><div class="application-field"><input type="text" name="eeo[disabilitySignatureDate]"></div></label></div></div>
<button type="submit" class="postings-btn template-btn-submit">Submit application</button>
</form>
<form id="other-form"><label><div class="application-label">Newsletter</div><input type="text" name="newsletter"></label></form>
</body></html>
