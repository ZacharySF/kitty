<!doctype html>
<html><head><meta charset="utf-8"><title>Greenhouse-like form</title></head>
<body>
<script src="guard.js"></script>
<form id="application" action="/trap/submit" method="post">
  <h2>Apply for this job</h2>
  <div class="input-wrapper"><label for="first_name">First Name<span>*</span></label>
    <input id="first_name" type="text" autocomplete="given-name" aria-required="true"></div>
  <div class="input-wrapper"><label for="last_name">Last Name<span>*</span></label>
    <input id="last_name" type="text" autocomplete="family-name" aria-required="true"></div>
  <div class="input-wrapper"><label for="preferred_name">Preferred First Name</label>
    <input id="preferred_name" type="text"></div>
  <div class="input-wrapper"><label for="email">Email<span>*</span></label>
    <input id="email" type="text" autocomplete="email" aria-required="true"></div>
  <div class="input-wrapper"><label for="phone">Phone<span>*</span></label>
    <input id="phone" type="tel" aria-required="true"></div>

  <div class="field-wrapper">
    <label id="location-label" for="candidate-location">Location (City)<span>*</span></label>
    <div class="select__control">
      <div class="select__value"></div>
      <input id="candidate-location" type="text" role="combobox" aria-labelledby="location-label" aria-required="true">
    </div>
  </div>

  <div class="file-upload">
    <div class="label" id="resume-label">Resume/CV<span>*</span></div>
    <button type="button">Attach</button>
    <label for="resume" class="visually-hidden">Attach</label>
    <input id="resume" type="file" style="display:none" required>
  </div>
  <div class="file-upload">
    <div class="label">Cover Letter</div>
    <button type="button">Attach</button>
    <input id="cover_letter" type="file" style="display:none">
  </div>

  <div class="input-wrapper"><label for="question_1">LinkedIn Profile</label>
    <input id="question_1" type="text"></div>

  <div class="field-wrapper">
    <label id="question_2-label" for="question_2">Are you legally authorized to work in the United States?<span>*</span></label>
    <div class="select__control">
      <div class="select__value"></div>
      <input id="question_2" type="text" role="combobox" aria-labelledby="question_2-label" aria-required="true">
    </div>
  </div>

  <div class="field-wrapper">
    <label id="question_4-label" for="question_4">Expected graduation.<span>*</span></label>
    <div class="select__control">
      <div class="select__value"></div>
      <input id="question_4" type="text" role="combobox" aria-labelledby="question_4-label" aria-required="true">
    </div>
  </div>

  <div class="field-wrapper">
    <label for="major">Major<span>*</span></label>
    <div class="select__control">
      <div class="select__value"></div>
      <input id="major" type="text" role="combobox" aria-required="true">
    </div>
  </div>

  <div class="input-wrapper"><label for="question_3">What is the most impressive thing you have ever accomplished?<span>*</span></label>
    <textarea id="question_3" aria-required="true"></textarea></div>

  <h3>Voluntary Self-Identification</h3>
  <div class="input-wrapper"><label for="gender">Gender</label>
    <select id="gender"><option value="">Select...</option><option value="1">Male</option>
      <option value="2">Female</option><option value="3">Decline to self-identify</option></select></div>

  <button type="submit">Submit application</button>
</form>
<script>
  searchBox(document.getElementById('candidate-location'),
            ['Arlington, Texas, United States', 'Arlington, Virginia, United States',
             'Austin, Texas, United States']);
  searchBox(document.getElementById('question_2'), ['Yes', 'No']);
  searchBox(document.getElementById('question_4'), ['2032 - Spring', '2032 - Fall', 'Other']);
  searchBox(document.getElementById('major'),
            ['Electrical Engineering Technology', 'Electrical Engineering', 'Mechanical Engineering']);
</script>
</body></html>
