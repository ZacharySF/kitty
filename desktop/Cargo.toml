[package]
name = "kitty-workspace"
version = "0.3.6"
description = "kitty! private Linux desktop workspace"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "=2.12.0"
tauri-plugin-dialog = "2"
url = "2"
serde_json = "1"
open = "5"
parking_lot = "0.12"
libc = "0.2"

[dev-dependencies]
tauri = { version = "2.8.5", features = ["test"] }
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
