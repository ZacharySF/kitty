[package]
name = "kitty-workspace"
version = "0.1.0"
description = "kitty! private Linux desktop workspace"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
url = "2"
serde_json = "1"
open = "5"
parking_lot = "0.12"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
