[package]
name = "rika-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "rika!'s local web front: serves the UI, enforces its security rules, answers ported routes and forwards the rest to the Python backend"

[dependencies]
# Versions match desktop/Cargo.lock so the shell can embed this crate without new builds.
bytes = "1.12"
form_urlencoded = "1.2"
getrandom = "0.3"
hex = "0.4"
http-body-util = "0.1.5"
libc = "0.2.191"
hyper = { version = "1.12", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
percent-encoding = "2.3"
# `kitty.core.sources.safe_error`'s redaction patterns (crate::bootstrap).
regex = "1.13"
# The workspace database (crate::migrations, crate::bootstrap); bundled, so the FTS5 and
# trigram tokenizers the schema uses are always there.
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# Python's dict order in answers the front builds itself.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
subtle = "2.6"
tokio = { version = "1.54", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
