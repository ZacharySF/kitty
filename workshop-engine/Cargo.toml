[package]
name = "kitty-workshop"
version = "0.1.0"
edition = "2021"
description = "rika! Resume Workshop engine: sandboxed compiles, PDF inspection and untrusted-document readers"
license = "MIT"
publish = false

[dependencies]
# PDF rasterizing and text in pure Rust (unsafe code forbidden upstream): no C parser
# touches untrusted PDFs. Default features embed the 14 standard fonts and CMaps.
hayro = "0.9"
hayro-interpret = "0.9"
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
# Chromium's DevTools protocol over a loopback WebSocket, synchronous, no TLS.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
unicode-normalization = "0.1"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
